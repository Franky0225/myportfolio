<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results summary component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="overview">
            <div class="result">
                <h3>Your Result</h3>
                <div class="resultNumber">
                    <p class="score">76</p>
                    <p>of 100</p>
                </div>
                <h2>Great</h2>
                <p>You scored higher that 65% of the people who have taken these tests.</p>
            </div>

            <div class="summary">
                <h3>Summary</h3>
                <ul>
                    <li>Reaction</li>
                    <li>Memory</li>
                    <li>Verbal</li>
                    <li>Visual</li>
                </ul>
                <button>Continue</button>
            </div>
        </div>
    </main>
    


</body>
</html>
